[project]
name = "deephedge"
version = "0.1.0"
description = "Deep hedging of European options, from Black-Scholes to real equity markets"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "torch", "tqdm", "requests"]

[tool.setuptools]
packages = ["deephedge"]

[tool.pytest.ini_options]
pythonpath = ["."]
